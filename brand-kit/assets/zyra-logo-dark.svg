    <circle cx="44" cy="20" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(90, 48)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="32" fill="#ffffff" letter-spacing="-0.5px">Zyra <tspan fill="#38bdf8">Digitals</tspan></text>
    <text y="18" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="2.2px">HIGH PERFORMANCE WEB &amp; SEO</text>
