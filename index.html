<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="author" content="Mohan Prasath S - Zyra Digitals" />
    <meta name="creator" content="Mohan Prasath S" />
    <meta name="publisher" content="Zyra Digitals" />

    <!--
      Default (homepage) metadata. Marked with data-rh="true" so react-helmet-async
      replaces it per-route on the client, and wrapped in markers so the Node server
      (server.mjs) can replace the whole block with route-specific values.
    -->
    <!-- SEO_DEFAULT_START -->
    <title>Zyra Digitals - Web Design, SEO &amp; Branding Agency in Coimbatore</title>
    <meta
      data-rh="true"
      name="description"
      content="Zyra Digitals is a website design, SEO and branding agency in Coimbatore, Tamil Nadu, working online with businesses across India. 100+ websites delivered. Free quote within 1 hour."
    />
    <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="Zyra Digitals" />
    <meta data-rh="true" property="og:locale" content="en_IN" />
    <meta
      data-rh="true"
      property="og:title"
      content="Zyra Digitals - Web Design, SEO &amp; Branding Agency in Coimbatore"
    />
    <meta
      data-rh="true"
      property="og:description"
      content="Website design, SEO and branding for businesses in Coimbatore and across India. 100+ websites designed and delivered."
    />
    <meta data-rh="true" property="og:url" content="https://www.zyradigitals.com/" />
    <meta data-rh="true" property="og:image" content="https://www.zyradigitals.com/og/web-design.jpg" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta
      data-rh="true"
      name="twitter:title"
      content="Zyra Digitals - Web Design, SEO &amp; Branding Agency in Coimbatore"
    />
    <meta
      data-rh="true"
      name="twitter:description"
      content="Website design, SEO and branding for businesses in Coimbatore and across India. 100+ websites designed and delivered."
    />
    <meta data-rh="true" name="twitter:image" content="https://www.zyradigitals.com/og/web-design.jpg" />
    <!-- SEO_DEFAULT_END -->

    <link rel="icon" href="/zyra-digitals-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/zyra-digitals-logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Zyra Digitals Blog"
      href="/rss.xml"
    />

    <!-- Fonts: preconnect + direct stylesheet link (faster than a CSS @import chain) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Geist+Mono:wght@400;500;600&display=swap"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
